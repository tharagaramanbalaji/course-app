services:
  # --- Backend FastAPI Web Service ---
  - type: web
    name: course-app-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python scripts/setup_db.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: course-app-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BACKEND_CORS_ORIGINS
        sync: false # Set to your Vercel URL, e.g. ["https://<your-app>.vercel.app"]
      - key: FRONTEND_URL
        sync: false # Set to your Vercel URL, e.g. https://<your-app>.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SSO_ALLOWED_DOMAINS
        sync: false
      - key: PDFMONKEY_API_KEY
        sync: false
      - key: PDFMONKEY_TEMPLATE_ID
        sync: false

# --- Managed PostgreSQL Database on Render ---
databases:
  - name: course-app-db
    databaseName: courseapp
    user: courseapp
    plan: free
